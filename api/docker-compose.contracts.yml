services:
  postgres:
    image: postgres:17.6-alpine@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?generated by tooling/contracts.js}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?generated by tooling/contracts.js}
      POSTGRES_DB: ${POSTGRES_DB:?generated by tooling/contracts.js}
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:?generated by tooling/contracts.js}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 3s

  happyview:
    image: ghcr.io/gamesgamesgamesgamesgames/happyview:2.13.0@sha256:df44f5c7275e16cd6755b75c37e089fb22b24361f7084d1dc66f07d9c5667e64
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DATABASE_MAX_CONNECTIONS: "8"
      PUBLIC_URL: http://127.0.0.1:3000
      HOST: 0.0.0.0
      PORT: "3000"
      SESSION_SECRET: ${SESSION_SECRET:?generated by tooling/contracts.js}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:?generated by tooling/contracts.js}
      JETSTREAM_URL: ws://127.0.0.1:9
      RELAY_URL: http://127.0.0.1:9
      PLC_URL: http://127.0.0.1:9
      HTTP_PROXY: http://127.0.0.1:9
      HTTPS_PROXY: http://127.0.0.1:9
      ALL_PROXY: http://127.0.0.1:9
      NO_PROXY: localhost,127.0.0.1,::1,postgres
      http_proxy: http://127.0.0.1:9
      https_proxy: http://127.0.0.1:9
      all_proxy: http://127.0.0.1:9
      no_proxy: localhost,127.0.0.1,::1,postgres
    ports:
      - "127.0.0.1:${HAPPYVIEW_HOST_PORT:?generated by tooling/contracts.js}:3000"
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - 'exec 3<>/dev/tcp/127.0.0.1/3000 && printf "GET /health HTTP/1.0\r\nHost: localhost\r\n\r\n" >&3 && head -n 1 <&3 | grep -q " 200 "'
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 10s
    stop_grace_period: 10s

