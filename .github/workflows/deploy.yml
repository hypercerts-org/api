name: Deploy

on:
  push:
    branches: [main, staging, production]
    paths-ignore:
      - "docs/**"
      - "packages/**"
      - ".agents/**"
      - ".changeset/**"
      - "**/*.md"
      - "LICENSE-APACHE"
      - "LICENSE-MIT"
      - ".gitignore"
      - ".git-blame-ignore-revs"
      - "biome.json"
      - "lefthook.yml"
      - "tsconfig.base.json"
      - "tooling/**"
      - ".github/workflows/hypercerts-api.yml"
      - ".github/workflows/release.yml"
      - "happyview-modules/tests/**"
      - "happyview-modules/.luacheckrc"
      - "happyview-modules/tsconfig.json"
      - "happyview-modules/docker-compose.contracts.yml"
      # Installer (installer.js, lexicon-source.js) is deliberately NOT listed. Other scripts are
      # listed by name so a new file the installer starts importing fails safe (deploys).
      - "happyview-modules/tooling/build-lua.js"
      - "happyview-modules/tooling/lint-lua.js"
      - "happyview-modules/tooling/lua-bundles.js"
      - "happyview-modules/tooling/lua-maintainability.js"
      - "happyview-modules/tooling/run-http-tests.js"
      - "happyview-modules/tooling/run-unit-tests.js"
      - "happyview-modules/tooling/seed.js"
      - "happyview-modules/tooling/validate-lexicons.js"
      - "happyview-modules/tooling/smoke.js"
      - "happyview-modules/tooling/smoke-core.js"
      - "happyview-modules/tooling/smoke-cases.js"
      - "happyview-modules/tooling/e2e.js"
      - ".github/workflows/smoke.yml"
      - ".github/workflows/e2e-nightly.yml"

permissions:
  contents: read

jobs:
  # Branch and GitHub environment names differ, so map them explicitly here,
  # once; the `environment` and `concurrency` keys cannot read workflow `env`.
  resolve:
    name: Resolve deploy environment
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.map.outputs.environment }}
    steps:
      - id: map
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          case "$BRANCH" in
            main) environment=Test ;;
            staging) environment=Staging ;;
            production) environment=Production ;;
            *) echo "::error::No deploy environment is mapped to branch '$BRANCH'; add it to deploy.yml." >&2; exit 1 ;;
          esac
          echo "environment=$environment" >> "$GITHUB_OUTPUT"

  deploy:
    name: Install HappyView modules (${{ needs.resolve.outputs.environment }})
    needs: resolve
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve.outputs.environment }}
    # Deploys to one environment run one at a time and are never cancelled midway.
    concurrency:
      group: deploy-${{ needs.resolve.outputs.environment }}
      cancel-in-progress: false
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install API modules into HappyView
        env:
          HAPPYVIEW_BASE_URL: ${{ vars.HAPPYVIEW_BASE_URL }}
          HAPPYVIEW_ADMIN_TOKEN: ${{ secrets.HAPPYVIEW_ADMIN_TOKEN }}
          HYPERCERTS_HANDLE_RESOLVER_URL: ${{ vars.HYPERCERTS_HANDLE_RESOLVER_URL }}
        # The repo is the source of truth: replace any differing installed assets.
        run: pnpm --filter @hypercerts-org/happyview-modules install:api --override

  # Read-only check that the live API answers every installed query after the install.
  # Anonymous GETs only, so it needs no secrets. HAPPYVIEW_BASE_URL is the HappyView origin,
  # which serves both /admin (used above) and the public /xrpc API.
  smoke:
    name: Smoke test (${{ needs.resolve.outputs.environment }})
    needs: [resolve, deploy]
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve.outputs.environment }}
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Smoke test the deployed API
        env:
          API_BASE_URL: ${{ vars.HAPPYVIEW_BASE_URL }}
        run: pnpm smoke
