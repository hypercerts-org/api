name: Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [closed]

permissions: {}

concurrency:
  group: release-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  select-mode:
    name: Select Changesets mode
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.select-mode.outputs.mode }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.15.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Select Changesets mode
        id: select-mode
        uses: changesets/action/select-mode@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1

  version:
    name: Create or update Release PR
    if: github.event_name == 'push' && needs.select-mode.outputs.mode == 'version'
    needs: select-mode
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # The Release Bot app, as in the lexicon repository: a Release PR opened
      # with GITHUB_TOKEN would not trigger CI.
      - name: Generate Release Bot app token
        id: generate-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          token: ${{ steps.generate-token.outputs.token }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.15.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Version packages and changelogs
        uses: changesets/action/version@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1
        with:
          github-token: ${{ steps.generate-token.outputs.token }}
          script: pnpm version:packages
          commit-message: "release: version packages"
          pr-title: Release packages
          pr-base-branch: main
        env:
          GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}

  publish:
    name: Validate and publish releases
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'changeset-release/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # npm Trusted Publishing: npm exchanges the workflow's OIDC token for a
      # short-lived publish token, so the repository holds no npm token.
      id-token: write
    steps:
      - name: Generate Release Bot app token
        id: generate-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Check out exact merged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release commit
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -euo pipefail
          if [ -z "$EXPECTED_SHA" ]; then
            echo "::error::The merged Release pull request did not provide a merge commit SHA"
            exit 1
          fi
          actual_sha="$(git rev-parse HEAD)"
          if [ "$actual_sha" != "$EXPECTED_SHA" ]; then
            echo "::error::Expected commit $EXPECTED_SHA but checked out $actual_sha"
            exit 1
          fi

      - name: Set up Lua 5.4
        uses: leafo/gh-actions-lua@6919171ccf181b826f44b9bca76307b577217377 # v13.0.0
        with:
          luaVersion: "5.4"

      - name: Add Lua 5.4 executable alias
        run: |
          lua_bin="$(command -v lua)"
          ln -s "$lua_bin" "${lua_bin%/*}/lua5.4"
          lua5.4 -e 'assert(_VERSION == "Lua 5.4", "expected Lua 5.4")'

      - uses: leafo/gh-actions-luarocks@35d062def313a7699a0d513e996bcf4352f05389 # v6.1.0

      - name: Install Luacheck
        run: luarocks install luacheck 1.2.0

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.15.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check packages
        run: pnpm check

      - name: Build packages
        run: pnpm build

      - name: Check existing tags and GitHub Releases
        id: preflight
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Every released package, as name@version: the workspace packages
          # that Changesets does not ignore.
          tags="$(node --input-type=module --eval '
            import { readFileSync } from "node:fs";
            const read = (file) => JSON.parse(readFileSync(file, "utf8"));
            const ignored = new Set(read(".changeset/config.json").ignore);
            for (const manifest of ["happyview-modules/package.json", "packages/api/package.json"]) {
              const { name, version } = read(manifest);
              if (!name || !version) throw new Error(`No name or version in ${manifest}`);
              if (!ignored.has(name)) console.log(`${name}@${version}`);
            }
          ')"
          api_url="${GITHUB_API_URL%/}"

          get_status() {
            local endpoint="$1"
            local status
            if ! status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "${api_url}/${endpoint}")"; then
              echo "::error::Unable to query GitHub while checking ${endpoint}" >&2
              exit 1
            fi
            printf '%s' "$status"
          }

          # Publishing runs when at least one package version has no tag and
          # GitHub Release yet; Changesets skips the versions already released.
          publish=false
          for tag in $tags; do
            tag_status="$(get_status "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}")"
            release_status="$(get_status "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}")"
            case "${tag_status}:${release_status}" in
              200:200)
                echo "${tag} already has both a remote tag and GitHub Release."
                ;;
              404:404)
                echo "No existing tag or GitHub Release found for ${tag}; publishing is required."
                publish=true
                ;;
              200:404)
                echo "::error::Release state is inconsistent for ${tag}: the remote tag exists but the GitHub Release is missing. Reconcile the tag and Release manually, then rerun this workflow."
                exit 1
                ;;
              404:200)
                echo "::error::Release state is inconsistent for ${tag}: the GitHub Release exists but the remote tag is missing. Reconcile the tag and Release manually, then rerun this workflow."
                exit 1
                ;;
              *)
                echo "::error::Unexpected GitHub API response while checking ${tag}: tag=${tag_status}, release=${release_status}"
                exit 1
                ;;
            esac
          done
          if [ "$publish" = false ]; then
            echo "::notice::Every package version already has a tag and GitHub Release; nothing to publish."
          fi
          echo "publish=${publish}" >> "$GITHUB_OUTPUT"

      # Changesets publishes public packages to npm (through `pnpm publish`,
      # which hands the tarball to the npm CLI bundled with Node 24, new enough
      # for Trusted Publishing), tags private packages, and creates a tag and
      # GitHub Release for each released version.
      - name: Publish to npm, create tags and GitHub Releases
        if: steps.preflight.outputs.publish == 'true'
        uses: changesets/action/publish@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1
        with:
          github-token: ${{ steps.generate-token.outputs.token }}
          create-github-releases: true
          push-git-tags: true
        env:
          NPM_CONFIG_PROVENANCE: true
