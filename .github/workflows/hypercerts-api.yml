name: CI

on:
  pull_request:
    paths:
      - "**"
      - ".github/workflows/hypercerts-api.yml"
  push:
    branches: [main, dev]
    paths:
      - "**"
      - ".github/workflows/hypercerts-api.yml"

permissions:
  contents: read

jobs:
  checks:
    name: API validation and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: leafo/gh-actions-lua@6919171ccf181b826f44b9bca76307b577217377 # v13.0.0
        with:
          luaVersion: "5.4"

      - name: Add Lua 5.4 executable alias
        run: |
          lua_bin="$(command -v lua)"
          ln -s "$lua_bin" "${lua_bin%/*}/lua5.4"
          lua5.4 -e 'assert(_VERSION == "Lua 5.4", "expected Lua 5.4")'

      - uses: leafo/gh-actions-luarocks@35d062def313a7699a0d513e996bcf4352f05389 # v6.1.0

      - name: Install Luacheck
        run: luarocks install luacheck 1.2.0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.15.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Changesets when present
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          changeset_files="$(git diff --name-only --diff-filter=ACMR "$BASE_SHA...$HEAD_SHA" -- '.changeset/*.md' ':!.changeset/README.md')"
          if [ -n "$changeset_files" ]; then
            pnpm exec changeset status --since "$BASE_SHA"
          fi

      - name: Check API and explorer tests
        run: pnpm check

      - name: Build API Lua bundles and explorer
        run: pnpm build

  runtime-contracts:
    name: Runtime contract tests (HappyView + PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      COMPOSE_PROJECT_NAME: happyview-contract-${{ github.run_id }}-${{ github.run_attempt }}
      HAPPYVIEW_BASE_URL: http://127.0.0.1:18080
      HYPERCERTS_HANDLE_RESOLVER_URL: https://resolver.invalid
      PSQL_PATH: /usr/bin/psql
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.15.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Create disposable Compose environment
        run: |
          set -euo pipefail
          env_file="$RUNNER_TEMP/happyview-contract.env"
          umask 077
          postgres_user="contract_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          postgres_password="$(openssl rand -hex 32)"
          postgres_db="happyview_contract_test_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          session_secret="$(openssl rand -hex 48)"
          token_encryption_key="$(openssl rand -base64 32 | tr -d '\n')"
          cat > "$env_file" <<EOF
          POSTGRES_USER=$postgres_user
          POSTGRES_PASSWORD=$postgres_password
          POSTGRES_DB=$postgres_db
          POSTGRES_HOST_PORT=15432
          HAPPYVIEW_HOST_PORT=18080
          SESSION_SECRET=$session_secret
          TOKEN_ENCRYPTION_KEY=$token_encryption_key
          EOF
          chmod 600 "$env_file"
          printf '::add-mask::%s\n' "$postgres_password"
          printf '::add-mask::%s\n' "$session_secret"
          printf '::add-mask::%s\n' "$token_encryption_key"
          printf 'COMPOSE_ENV_FILE=%s\n' "$env_file" >> "$GITHUB_ENV"

      - name: Start HappyView and PostgreSQL
        timeout-minutes: 5
        run: docker compose --project-name "$COMPOSE_PROJECT_NAME" --env-file "$COMPOSE_ENV_FILE" -f api/docker-compose.contracts.yml up --detach

      - name: Wait for HappyView health
        timeout-minutes: 4
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 180))
          until curl --fail --silent --max-time 2 "$HAPPYVIEW_BASE_URL/health" >/dev/null 2>&1; do
            if (( SECONDS >= deadline )); then
              echo "HappyView did not become healthy within 180 seconds" >&2
              exit 1
            fi
            sleep 2
          done
          echo "HappyView is healthy at $HAPPYVIEW_BASE_URL/health"

      - name: Bootstrap disposable HappyView admin key
        timeout-minutes: 2
        run: |
          set -euo pipefail
          set -a
          source "$COMPOSE_ENV_FILE"
          set +a
          export PGPASSWORD="$POSTGRES_PASSWORD"
          admin_token="hv_$(openssl rand -hex 16)"
          key_hash="$(printf '%s' "$admin_token" | sha256sum | cut -d ' ' -f 1)"
          user_id="$(node -e 'process.stdout.write(require("node:crypto").randomUUID())')"
          api_key_id="$(node -e 'process.stdout.write(require("node:crypto").randomUUID())')"
          did="did:web:contract-$(openssl rand -hex 4).invalid"
          created_at="$(date -u +'%Y-%m-%dT%H:%M:%S.%3NZ')"
          permissions='["lexicons:create","lexicons:read","script-variables:create","script-variables:read","scripts:read","scripts:manage"]'
          "$PSQL_PATH" --no-psqlrc --set ON_ERROR_STOP=1 \
            --host 127.0.0.1 --port "$POSTGRES_HOST_PORT" \
            --dbname "$POSTGRES_DB" --username "$POSTGRES_USER" <<SQL
          BEGIN;
          INSERT INTO happyview_users (id, did, is_super, created_at)
            VALUES ('$user_id', '$did', 1, '$created_at');
          INSERT INTO happyview_user_permissions (user_id, permission, granted_at)
            VALUES ('$user_id', 'lexicons:create', '$created_at'),
                   ('$user_id', 'lexicons:read', '$created_at'),
                   ('$user_id', 'script-variables:create', '$created_at'),
                   ('$user_id', 'script-variables:read', '$created_at'),
                   ('$user_id', 'scripts:read', '$created_at'),
                   ('$user_id', 'scripts:manage', '$created_at');
          INSERT INTO happyview_api_keys (id, user_id, name, key_hash, key_prefix, permissions, created_at)
            VALUES ('$api_key_id', '$user_id', 'hypercerts contract runner', '$key_hash', '${admin_token:0:11}', '$permissions', '$created_at');
          COMMIT;
          SQL
          printf '::add-mask::%s\n' "$admin_token"
          printf 'HAPPYVIEW_ADMIN_TOKEN=%s\n' "$admin_token" >> "$GITHUB_ENV"

      - name: Install this checkout's API manifest
        timeout-minutes: 4
        run: pnpm --filter @hypercerts-org/hypercerts-api run install:api

      - name: Seed disposable PostgreSQL fixtures
        timeout-minutes: 4
        run: |
          set -euo pipefail
          set -a
          source "$COMPOSE_ENV_FILE"
          set +a
          export HAPPYVIEW_DISPOSABLE_TEST_TARGET=YES
          export PGHOST=127.0.0.1
          export PGPORT="$POSTGRES_HOST_PORT"
          export PGDATABASE="$POSTGRES_DB"
          export PGUSER="$POSTGRES_USER"
          export PGPASSWORD="$POSTGRES_PASSWORD"
          export PGSSLMODE=disable
          pnpm --filter @hypercerts-org/hypercerts-api run seed:test

      - name: Run contract tests present in this checkout
        working-directory: api
        timeout-minutes: 5
        run: |
          set -euo pipefail
          shopt -s nullglob
          suites=(tests/contracts/*.contract.test.js)
          normal_suites=()
          bad_date_suite=""
          for suite in "${suites[@]}"; do
            if [[ "${suite##*/}" == "location-bad-dates.contract.test.js" ]]; then
              bad_date_suite="$suite"
            else
              normal_suites+=("$suite")
            fi
          done
          if ((${#suites[@]} == 0)); then
            echo "No HTTP contract test files are present in this checkout; skipping endpoint tests."
            exit 0
          fi
          if ((${#normal_suites[@]} > 0)); then
            node --test "${normal_suites[@]}"
          fi
          if [[ -n "$bad_date_suite" ]]; then
            set -a
            source "$COMPOSE_ENV_FILE"
            set +a
            export HAPPYVIEW_DISPOSABLE_TEST_TARGET=YES
            export PGHOST=127.0.0.1
            export PGPORT="$POSTGRES_HOST_PORT"
            export PGDATABASE="$POSTGRES_DB"
            export PGUSER="$POSTGRES_USER"
            export PGPASSWORD="$POSTGRES_PASSWORD"
            export PGSSLMODE=disable
            pnpm run seed:bad-dates
            node --test "$bad_date_suite"
          fi

      - name: Show Compose logs on failure
        if: failure()
        continue-on-error: true
        env:
          COMPOSE_ENV_FILE: ${{ runner.temp }}/happyview-contract.env
        run: |
          if [[ -f "$COMPOSE_ENV_FILE" ]]; then
            docker compose --project-name "$COMPOSE_PROJECT_NAME" --env-file "$COMPOSE_ENV_FILE" -f api/docker-compose.contracts.yml logs --no-color --timestamps
          fi

      - name: Remove HappyView and PostgreSQL
        if: always()
        env:
          COMPOSE_ENV_FILE: ${{ runner.temp }}/happyview-contract.env
        run: |
          set -euo pipefail
          if [[ ! -f "$COMPOSE_ENV_FILE" ]]; then
            exit 0
          fi
          cleanup_status=0
          docker compose --project-name "$COMPOSE_PROJECT_NAME" --env-file "$COMPOSE_ENV_FILE" -f api/docker-compose.contracts.yml down --volumes --remove-orphans || cleanup_status=$?
          rm -f "$COMPOSE_ENV_FILE"
          exit "$cleanup_status"
