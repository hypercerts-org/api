name: Nightly e2e

# Deep read-only checks (pagination walks, 100-subject batches, cross-endpoint count invariants).
# Too slow for the deploy path, so they run off-peak, one environment at a time, and every
# environment reports even when an earlier one fails.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    name: E2E (${{ matrix.environment }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: e2e-${{ matrix.environment }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      max-parallel: 1
      # URLs are mapped here because these environments only deploy from their own branches,
      # so a job running from main cannot use `environment:` to read their variables.
      matrix:
        include:
          - environment: Test
            url: https://test.api.hypercerts.dev
          - environment: Staging
            url: https://api.staging.hypercerts.dev
          - environment: Production
            url: https://api.hypercerts.dev
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run e2e checks
        env:
          API_BASE_URL: ${{ matrix.url }}
        run: pnpm e2e
