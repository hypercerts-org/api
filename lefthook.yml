# Git hooks. Installed by `pnpm install` via the `prepare` script.
# Keep pre-commit fast (staged files only); slower checks run at pre-push and in CI.
pre-commit:
  commands:
    biome:
      run: pnpm exec biome check --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true

pre-push:
  commands:
    check:
      run: pnpm check
